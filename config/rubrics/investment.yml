# RUBRIC: investment team (PMs / analysts)
#
# "What does this mean for our positions?"
#
# This is the fund-specific file. Everything BIT-particular about what counts
# as important lives HERE, not in code — swap this one file and the system
# ranks for a different fund without a line changing.
#
# WHY IT IS A SEPARATE FILE AT ALL, measured rather than assumed: a single
# rubric produced a single ranking in which `commercial` events took 60% of the
# top 50 at a 6.2x lift, while `research` and `benchmark` — 34% of the corpus —
# took ZERO slots. That is not a defect of this rubric. It is this rubric
# working correctly: to an investment reader a paper genuinely does rank below
# a price change. It is a demonstration that one ranking cannot serve two
# audiences, which is why config/rubrics/technical.yml exists.

name: investment
version: 1
audience: Investment team (PMs / analysts)
owner: "BIT PM — unassigned"

question: |
  which event moves a number in one of the fund's transmission channels, more
  directly and sooner?

# The fund cannot trade the labs — they are private or far above its market-cap
# band — so a lab event reaches the portfolio only through one of these.
# Names come from config/policy.yml so the two files cannot drift apart.
use_policy_channels: true

rules:
  - Channel over no channel. An event touching a channel beats one that does
    not, however technically impressive the latter is. If BOTH have a channel,
    or NEITHER does, this rule does not separate them — continue to rule 2.
  - Quantity over topic. An event that changes a NUMBER in a channel beats one
    that merely relates to it. "Trained on 100k H100s" moves a number;
    "we care about efficiency" does not.
  - Sooner over later. Shipped, contracted or hired beats stated intention.
    Announced beats rumoured.
  - Specific over vague. Named parties, dates, magnitudes, model names.
  - New over restated. An echo of an earlier event carries less.

banned:
  - Lab identity or prestige. You are not told which lab published these, and
    guessing is a rule violation.
  - Technical impressiveness on its own. A benchmark SOTA is channel "none"
    unless it implies compute, energy, data or displacement.
  - Vendor case studies. A post about what a CUSTOMER built with the lab's API
    is marketing, not a lab development. It ranks below any genuine lab event.
