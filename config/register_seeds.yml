# Register seed data — the tracked labs, their founding people, and the curated
# X-handle candidate list. Moved out of fli/knowledge/register/{seeding,
# x_identities}.py so the tracked universe is config, editable without a code
# change, alongside register_overrides.yml.
#
# Everything here is a CANDIDATE, not a fact. Seeding is gated on a VERBATIM
# name match in a fetched lab page; an X handle is admitted only if the live
# profile corroborates it. Failures land in `rejections`, so the miss rate is
# a number in the report rather than a silent gap.

labs:
  - name: OpenAI
    is_public_company: 0
    parent_ticker: null
    pages:
      - {url: "https://en.wikipedia.org/wiki/OpenAI", channel: third_party}
  - name: Anthropic
    is_public_company: 0
    parent_ticker: null
    pages:
      - {url: "https://www.anthropic.com/company", channel: official}
      - {url: "https://en.wikipedia.org/wiki/Anthropic", channel: third_party}
  - name: Google DeepMind
    is_public_company: 1
    parent_ticker: GOOGL
    pages:
      - {url: "https://deepmind.google/about/", channel: official}
      - {url: "https://en.wikipedia.org/wiki/Google_DeepMind", channel: third_party}
  - name: Meta AI
    is_public_company: 1
    parent_ticker: META
    # ai.meta.com/research removed 2026-07-23: refused urllib on 6/6 attempts
    # (HTTP 400; browser-stack only). Coverage via Wikipedia + feeds.
    pages:
      - {url: "https://en.wikipedia.org/wiki/Meta_AI", channel: third_party}
  - name: Mistral
    is_public_company: 0
    parent_ticker: null
    pages:
      - {url: "https://mistral.ai/company", channel: official}
      - {url: "https://en.wikipedia.org/wiki/Mistral_AI", channel: third_party}
  - name: DeepSeek
    is_public_company: 0
    parent_ticker: null
    pages:
      - {url: "https://www.deepseek.com/", channel: official}
      - {url: "https://en.wikipedia.org/wiki/DeepSeek", channel: third_party}
  - name: Qwen
    is_public_company: 1
    parent_ticker: BABA
    pages:
      - {url: "https://qwenlm.github.io/", channel: official}
      - {url: "https://en.wikipedia.org/wiki/Qwen", channel: third_party}
  - name: xAI
    is_public_company: 0
    parent_ticker: null
    # x.ai serves its company page client-side, the same wall as the OpenAI
    # blog and Mistral newsroom. Both URLs are listed anyway: whichever fails
    # is recorded in fetch_log, so the gap stays visible in the data.
    pages:
      - {url: "https://x.ai/about", channel: official}
      - {url: "https://en.wikipedia.org/wiki/XAI_(company)", channel: third_party}

# Collective author strings labs publish under on arXiv; presence on a paper
# is structural evidence that it is a lab paper (used by co-author expansion
# and stage-1 filtering). A new lab's collective is a config line, not code.
# OpenAI, Anthropic and xAI publish under individual names only — their
# absence here is a fact about arXiv, not a gap.
collective_authors:
  "DeepSeek-AI": DeepSeek
  "Qwen Team": Qwen
  "Gemini Team": Google DeepMind
  "Llama Team": Meta AI
  "Mistral AI": Mistral

seed_people:
  - {lab: OpenAI,          name: Sam Altman,        role: CEO,             tier: founder}
  - {lab: OpenAI,          name: Greg Brockman,     role: President,       tier: founder}
  - {lab: OpenAI,          name: Jakub Pachocki,    role: Chief Scientist, tier: research_lead}
  - {lab: OpenAI,          name: Mark Chen,         role: Chief Research Officer, tier: research_lead}
  - {lab: Anthropic,       name: Dario Amodei,      role: CEO,             tier: founder}
  - {lab: Anthropic,       name: Daniela Amodei,    role: President,       tier: founder}
  # research-role founders are tiered research_lead so they anchor co-author
  # expansion: a hands-on Chief Scientist / CTO co-authors real
  # research, unlike a CEO co-signing an institutional paper.
  - {lab: Anthropic,       name: Jared Kaplan,      role: Chief Science Officer, tier: research_lead}
  - {lab: Anthropic,       name: Chris Olah,        role: null,            tier: research_lead}
  - {lab: Google DeepMind, name: Demis Hassabis,    role: CEO,             tier: founder}
  - {lab: Google DeepMind, name: Koray Kavukcuoglu, role: CTO,             tier: research_lead}
  - {lab: Meta AI,         name: Yann LeCun,        role: Chief AI Scientist, tier: research_lead}
  - {lab: Meta AI,         name: Alexandr Wang,     role: null,            tier: research_lead}
  - {lab: Mistral,         name: Arthur Mensch,     role: CEO,             tier: founder}
  - {lab: Mistral,         name: Guillaume Lample,  role: Chief Scientist, tier: research_lead}
  - {lab: Mistral,         name: Timothée Lacroix,  role: CTO,             tier: research_lead}
  - {lab: DeepSeek,        name: Liang Wenfeng,     role: CEO,             tier: founder}
  - {lab: Qwen,            name: Junyang Lin,       role: null,            tier: research_lead}
  # xAI seeds are candidates, not assertions: several of the founding research
  # team have since left. A name survives only if it appears verbatim on a
  # fetched page, the same gate every other seed passes, and failures land in
  # `rejections` as seed_name_not_on_page so the miss rate is measurable.
  #
  # A departed founder is not a mistake to prune. Affiliations are append-only
  # with an `observed_at`, so one person observed at two labs in a window is
  # exactly the mobility event this system exists to catch.
  - {lab: xAI,             name: Elon Musk,         role: CEO,             tier: founder}
  - {lab: xAI,             name: Greg Yang,         role: null,            tier: research_lead}
  - {lab: xAI,             name: Jimmy Ba,          role: null,            tier: research_lead}
  - {lab: xAI,             name: Yuhuai Wu,         role: null,            tier: research_lead}
  - {lab: xAI,             name: Christian Szegedy, role: null,            tier: research_lead}
  - {lab: xAI,             name: Igor Babuschkin,   role: null,            tier: research_lead}

# Person-level fallback pages, fetched only when every lab page misses the name.
person_pages:
  Koray Kavukcuoglu:
    - {url: "https://blog.google/authors/koray-kavukcuoglu/", channel: official}
  Junyang Lin:
    - {url: "https://en.wikipedia.org/wiki/Junyang_Lin", channel: third_party}

