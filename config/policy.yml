# Editorial policy: what counts as decision-relevant to this fund.
#
#   channels  — the MECHANISM by which a lab event reaches a portfolio.
#               General; any technology fund has these.
#   positions — WHICH holdings exist and the vocabulary indicating exposure.
#               Fund-specific. Swap this block and the system works unchanged.
#
# Every rule here is applied at RENDER time. None of it reaches the scorer.

version: 3
owner: "BIT PM — unassigned"    # placeholder; nothing here has been reviewed
effective_from: "2026-07-26"
source: research/facts.md       # BIT's published materials, fetched 2026-07-22

# Terms match case-insensitively on WORD BOUNDARIES, never as substrings.
# Multi-word terms match as phrases. Mechanisms only — the industries they
# happen in belong under positions.holdings[].exposure_terms.
channels:
  compute_memory:           [gpu, gpus, h100, tpu, tpus, hbm, wafer, fab, flops, training run,
                             cluster, clusters, accelerator, accelerators, inference cost, chip, chips]

  energy_datacenter:        [megawatt, megawatts, gigawatt, gigawatts, datacenter, datacenters,
                             data center, data centers, power, grid, cooling, campus, energy]

  data_economics:           [licensing, license, training data, corpus, copyright, content deal,
                             crawl, crawling, data partnership]

  competitive_displacement: [deprecates, deprecated, replaces, replacing, undercuts,
                             api pricing, price cut, free tier, open weights,
                             general availability, bundled, bundling, acquires, acquisition]

  talent_movement:          [joining, joins, hiring, hires, welcome to the team,
                             appointed, appoints, departing, departs, stepping down, steps down,
                             co-founder, cofounder, new role, leading our, will lead,
                             leaving, left to join, poached, recruit, recruited]

# An ordering, not weights. Every event type in the corpus must appear (C17).
event_type_prior:
  infrastructure: 5
  commercial: 4
  personnel: 4
  release: 3
  research: 2
  open_source: 2
  benchmark: 1
  other: 0

# Co-author-discovered people auto-approved per lab. The one knob that changes
# how much of the firehose is eligible: stage 1 rejects documents with
# `no_tracked_entity`, so more tracked people means more documents reaching
# extraction. Raising it costs money, hence a policy decision with an owner.
slate_k: 15

# How far back a ranked report may reach. An editorial boundary on what to SHOW,
# not a claim about what the model learned — the scorer gives recency a near-zero
# coefficient on its own.
window_days: 90

# An event we cannot date cannot be shown as recent.
show_undated: false

# Mobility pairing bound: last-seen-at-A to first-seen-at-B further apart than
# this is a stale pairing, not a fresh move. Not a delay — the event is emitted
# in the same run whose re-observation saw the arrival.
mobility_window_days: 90

# Most seats one lab may take in a slate. NOT in tension with "lab identity is
# never a feature": identity is excluded from SCORING so the model cannot learn
# a lab is inherently interesting, and used HERE, at render time, to guarantee
# coverage. Opposite directions, both deliberate.
max_per_lab: 2

# Same-story suppression. A cluster is a near-duplicate CLAIM; a story is one
# announcement, and one announcement can produce several genuinely different
# claims. Skip a candidate if an already-selected item from the same lab within
# `story_days` shares an uncommon token — uncommon meaning it appears in
# <= story_rare_df of claims, so "released" cannot trigger it but "3.6" can.
story_rare_df: 0.03
story_days: 7

# Rubrics whose slate requires a transmission mechanism: an event the channel
# classifier rated "none" is dropped at render time. This is the investment
# rubric's rule 1 as an editorial boundary. ai_team is deliberately absent —
# "adopt this SDK fix" needs no portfolio channel.
require_mechanism: [investment]

# The rubric whose ranking lands in insights.score and which the evaluation
# figures describe by default. Must name a file: config/rubrics/<name>.yml.
primary_rubric: investment

# Baseline for the bake-off to beat, never the shipped scorer.
hand_weights:
  recency: 1.0
  corroboration: 0.6
  specificity: 0.5
  attribution_confidence: 0.4
  quote_len_words: 0.2

# POSITIONS — the one block another fund would replace.
#
# "What does this mean for our positions?" needs fund-specific facts: holdings,
# theses, tickers. They belong here, dated and sourced, rather than smuggled
# into a keyword list. `as_of` is mandatory (enforced in code) because holdings
# move quarterly and an undated list silently claims to be current.
#
# Weights come from the Q2 2026 quarterly, not the website's showcased
# securities — those carry BIT's own disclaimer that they are "neither top
# positions nor representative".
positions:
  as_of: "2026-06-30"
  source: "research/facts.md — Q2 2026 equity quarterly, top-10 table + commentary"
  holdings:
    - ticker: HNGE
      name: Hinge Health
      weight_pct: 4.2
      thesis: digital musculoskeletal care; named a current-positioning focus
      exposure_terms: [health, healthcare, medical, clinical, patient, physical therapy,
                       musculoskeletal, telehealth, physician, diagnosis]

    - ticker: OSCR
      name: Oscar Health
      weight_pct: 4.2
      thesis: insurtech; MLR 84.6% to 70.5%, members 2.04M to 3.20M
      exposure_terms: [health insurance, insurtech, medical loss ratio, payer,
                       health plan, member, healthcare, medical records]

    - ticker: MU
      name: Micron
      thesis: AI memory / HBM demand; the "memory supercycle"
      exposure_terms: [memory, hbm, dram, bandwidth, memory bandwidth]

    - ticker: IREN
      name: IREN
      thesis: power and datacenter capacity as the AI bottleneck
      exposure_terms: [datacenter, data center, megawatt, gigawatt, power, grid, capacity]

    - ticker: RDDT
      name: Reddit
      thesis: AI training-data licensing
      exposure_terms: [training data, licensing, content deal, forum, user-generated,
                       data partnership, crawl]

    - ticker: HOOD
      name: Robinhood
      thesis: retail wealth platform; named a current-positioning focus
      exposure_terms: [brokerage, broker, trading, retail investor, fintech, crypto trading]

    - ticker: TSM
      name: TSMC
      thesis: foundry; F.A.Z. headline BIT links, "TSMC displaces Nvidia"
      exposure_terms: [foundry, fab, wafer, node, tsmc, 3nm, 2nm]

    - ticker: AUTO
      name: Auto1
      thesis: named in Q2 current positioning
      exposure_terms: [used cars, automotive marketplace, auto1]
