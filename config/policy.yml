# ACTIVE policy. Previous version preserved at config/policy.v2.yml.bak.
#
# What counts as decision-relevant to this fund.
#
# v3 splits what v2 conflated:
#   channels  = the MECHANISM by which a lab event reaches a portfolio.
#               General. Any technology fund has these. Swap nothing.
#   positions = WHICH holdings exist, and the vocabulary that indicates
#               exposure to each. BIT-specific. Swap this block for another
#               fund and the system works unchanged.
#
# Why: v2 put sector nouns (health, broker, adtech) inside the
# `competitive_displacement` lexicon, so any post mentioning health scored as
# displacement whether or not anything was being displaced. Exposure and
# mechanism are different questions and now have different homes.

version: 3
owner: "BIT PM — unassigned"    # a placeholder; nothing here has been reviewed
effective_from: "2026-07-26"
source: research/facts.md       # BIT's published materials, fetched 2026-07-22

# ---------------------------------------------------------------------------
# CHANNELS — the general mechanism by which a lab event reaches a portfolio:
# the semiconductor and energy supply chains, a researcher leaving a lab to
# found a startup, a capability jump that threatens a holding's moat.
#
# Terms match case-insensitively on WORD BOUNDARIES, never as substrings.
# Multi-word terms match as phrases.
# ---------------------------------------------------------------------------
channels:
  compute_memory:           [gpu, gpus, h100, tpu, tpus, hbm, wafer, fab, flops, training run,
                             cluster, clusters, accelerator, accelerators, inference cost, chip, chips]

  # `energy` restored — dropped in the v2 edit, which cost a real signal:
  # "expanding our work with the US Dept. of @ENERGY ... committing $40M in AI tokens"
  # matched nothing at all.
  energy_datacenter:        [megawatt, megawatts, gigawatt, gigawatts, datacenter, datacenters,
                             data center, data centers, power, grid, cooling, campus, energy]

  data_economics:           [licensing, license, training data, corpus, copyright, content deal,
                             crawl, crawling, data partnership]

  # STRIPPED of sector nouns. What remains are displacement MECHANISMS — verbs
  # and commercial moves — not the industries they happen in. The industries
  # now live under `positions.holdings[].exposure_terms`.
  competitive_displacement: [deprecates, deprecated, replaces, replacing, undercuts,
                             api pricing, price cut, free tier, open weights,
                             general availability, bundled, bundling, acquires, acquisition]

  talent_movement:          [joining, joins, hiring, hires, welcome to the team,
                             appointed, appoints, departing, departs, stepping down, steps down,
                             co-founder, cofounder, new role, leading our, will lead,
                             leaving, left to join, poached, recruit, recruited]

# An ordering, not weights. Every event type in the corpus must appear (C17).
event_type_prior:
  infrastructure: 5
  commercial: 4
  personnel: 4
  release: 3
  research: 2
  open_source: 2
  benchmark: 1
  other: 0

# How many co-author-discovered people may be auto-approved PER LAB.
#
# Raised 5 -> 15. At 5 the register held 28 approved people against 1,095
# pending, and the approved cohort averaged 2.1 papers — while 510 pending
# candidates already met that bar. The gate was not selecting quality, it was
# just capping count.
#
# This is the one knob that changes how much of the firehose is even eligible:
# stage 1 rejects a document with `no_tracked_entity`, so more tracked people
# means more documents reaching extraction. Raising it therefore costs money,
# which is why it is a policy decision with a named owner rather than a default.
slate_k: 15

# How far back a ranked report may reach. Without a window, arXiv results from
# 2024 outranked 2026 launches: 12 of the top 20 were stale or undated.
# 90 days keeps 286 of 503 events (57%).
#
# This does NOT change scoring — the learned model gives recency a coefficient
# of 0.014, because the judge's rules reward "shipped vs intended", not
# publication date. The window is an editorial boundary applied at render time,
# which is the honest place for it: it is a decision about what to SHOW, not a
# claim about what the model learned.
window_days: 90

# Undated events (13 of 503) currently get a neutral recency of 0.5 and five of
# them reached the top 20. An event we cannot date cannot be shown as recent.
show_undated: false

# Most a single lab may occupy in one slate. Google DeepMind is 147 of 503
# events (128 of the 286 inside the window) and took 5 of the first 10 slots.
# That is the corpus, not a scoring bug — but a digest where half the items come
# from one lab is not a digest.
#
# Note this is NOT in tension with "lab identity is never a feature". Identity is
# excluded from SCORING so the model cannot learn that DeepMind is inherently
# more interesting; it is used HERE, at render time, to guarantee coverage. The
# two uses point in opposite directions and both are deliberate.
max_per_lab: 2

# Same-story suppression. A cluster is a near-duplicate CLAIM; a story is one
# announcement. The 21 July Gemini launch produced 12 events across 9 clusters,
# so cluster-dedupe alone still put four of them in the top 10 — correctly, since
# "3.6 Flash cuts output tokens 17%" and "3.6 Flash is rolling out" really are
# different claims. They are not different news.
#
# Rule: skip a candidate if an ALREADY-SELECTED item from the same lab, within
# `story_days`, shares an uncommon token. Uncommon = appears in <= story_rare_df
# of claims; common words like "released" (df 104) and "google" (df 97) cannot
# trigger it, while version tokens like "3.6" (df 7) and "1.1" (df 3) — which are
# what actually name a story — always can.
#
# 0.03 is the middle of a measured stable band, not a tuned value: sweeping
# 0.015 / 0.03 / 0.05 under max_per_lab=2 changes which items fill the last two
# slots and nothing above them.
story_rare_df: 0.03
story_days: 7

# The persona whose ranking also lands in insights.score, and which the
# evaluation figures describe unless told otherwise. Which audience the fund
# serves by default is a business decision, so it lives here, not in code.
# Must name a rubric file: config/rubrics/<name>.yml.
primary_rubric: investment

hand_weights:
  recency: 1.0
  corroboration: 0.6
  specificity: 0.5
  attribution_confidence: 0.4
  quote_len_words: 0.2

# ---------------------------------------------------------------------------
# POSITIONS — BIT-specific. The one block another fund would replace.
#
# Answering "what does this mean for our positions?" needs fund-specific facts:
# holdings, theses, tickers. A generic rubric cannot supply them, so they belong
# HERE — dated and sourced — rather than smuggled into a keyword list.
#
# `as_of` is mandatory (enforced in code). Holdings move quarterly and an
# undated list silently claims to be current.
#
# Provenance note: the website's showcased securities carry BIT's own
# disclaimer that they are "neither top positions nor representative". These
# weights come from the Q2 2026 quarterly instead, which is real disclosure.
# ---------------------------------------------------------------------------
positions:
  as_of: "2026-06-30"
  source: "research/facts.md — Q2 2026 equity quarterly, top-10 table + commentary"
  holdings:
    - ticker: HNGE
      name: Hinge Health
      weight_pct: 4.2
      thesis: digital musculoskeletal care; named a current-positioning focus
      exposure_terms: [health, healthcare, medical, clinical, patient, physical therapy,
                       musculoskeletal, telehealth, physician, diagnosis]

    - ticker: OSCR
      name: Oscar Health
      weight_pct: 4.2
      thesis: insurtech; MLR 84.6% to 70.5%, members 2.04M to 3.20M
      exposure_terms: [health insurance, insurtech, medical loss ratio, payer,
                       health plan, member, healthcare, medical records]

    - ticker: MU
      name: Micron
      thesis: AI memory / HBM demand; the "memory supercycle"
      exposure_terms: [memory, hbm, dram, bandwidth, memory bandwidth]

    - ticker: IREN
      name: IREN
      thesis: power and datacenter capacity as the AI bottleneck
      exposure_terms: [datacenter, data center, megawatt, gigawatt, power, grid, capacity]

    - ticker: RDDT
      name: Reddit
      thesis: AI training-data licensing
      exposure_terms: [training data, licensing, content deal, forum, user-generated,
                       data partnership, crawl]

    - ticker: HOOD
      name: Robinhood
      thesis: retail wealth platform; named a current-positioning focus
      exposure_terms: [brokerage, broker, trading, retail investor, fintech, crypto trading]

    - ticker: TSM
      name: TSMC
      thesis: foundry; F.A.Z. headline BIT links, "TSMC displaces Nvidia"
      exposure_terms: [foundry, fab, wafer, node, tsmc, 3nm, 2nm]

    - ticker: AUTO
      name: Auto1
      thesis: named in Q2 current positioning
      exposure_terms: [used cars, automotive marketplace, auto1]
